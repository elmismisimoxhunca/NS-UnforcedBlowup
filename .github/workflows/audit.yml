name: Verification metadata and publication guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/verify-openai.py metadata
      - run: python3 scripts/check-public-tree.py --include-untracked
